name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch:

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (pacote + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Lint advisory por enquanto: ainda há dívida de estilo pré-existente.
      # Não bloqueia o build — vira portão obrigatório após a Fase 7.4.
      - name: Lint (ruff, advisory)
        continue-on-error: true
        run: ruff check src tests

      - name: Tests (pytest)
        run: pytest
