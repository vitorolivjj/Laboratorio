name: Update operational dashboard snapshot

on:
  push:
    branches: [main]
    paths:
      - "tasks/**"
      - "crm/**"
      - "dashboard/**"
      - "scripts/update_dashboard_snapshot.py"
      - ".github/workflows/update-dashboard.yml"
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # Evita loop quando o próprio bot faz commit do snapshot
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[automated]')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snapshot
        run: python3 scripts/update_dashboard_snapshot.py

      - name: Commit snapshot if changed
        run: |
          if git diff --quiet dashboard/metricas_operacionais.md; then
            echo "Nenhuma alteração no dashboard."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/metricas_operacionais.md
          git commit -m "chore(dashboard): update operational snapshot [automated]"
          git push origin HEAD:main
