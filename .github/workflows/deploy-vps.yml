name: Deploy to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/painel-maestro/**"
      - "agentes/**"
      - "memoria/**"
      - "deploy/vps/**"
      - ".github/workflows/deploy-vps.yml"
  workflow_dispatch:

# Evita dois deploys simultâneos pisando um no outro.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Não dispara para os commits automáticos do snapshot do dashboard.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[automated]')
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            REPO_URL="${LAB_REPO_URL:-https://github.com/vitorolivjj/Laboratorio.git}"
            SRC=/opt/laboratorio-src
            echo "==> Garantindo a fonte dos scripts de deploy em $SRC..."
            if [ ! -d "$SRC/.git" ]; then
              echo "    (primeira vez) clonando o repositório..."
              git clone "$REPO_URL" "$SRC"
            fi
            git -C "$SRC" fetch origin main
            git -C "$SRC" checkout main
            git -C "$SRC" reset --hard origin/main
            echo "==> Rodando deploy-app.sh..."
            cd "$SRC/deploy/vps"
            chmod +x deploy-app.sh
            ./deploy-app.sh
