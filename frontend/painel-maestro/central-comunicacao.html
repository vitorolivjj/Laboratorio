<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Comunicação — Ronaldo Maestro</title>
  <meta name="theme-color" content="#070B16">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="plantao-page">
  <div class="grid-bg" aria-hidden="true"></div>

  <div class="plantao-wrap">
    <header class="plantao-header">
      <a href="index.html" class="plantao-back">← Dashboard</a>
      <span class="plantao-live"><span class="plantao-live-dot" id="plantao-state-dot" data-state="idle"></span> <span id="plantao-state-label">Aguardando</span></span>
    </header>

    <main class="plantao-main" id="voice-overlay">
      <div class="plantao-hero">
        <div class="voice-avatar-wrap plantao-avatar-wrap">
          <img src="assets/agentes/ronaldo-maestro.png" alt="Ronaldo Maestro" class="voice-avatar plantao-avatar">
          <div class="voice-ring plantao-ring" id="voice-ring"></div>
        </div>
        <h1>Central de Comunicação</h1>
        <p class="plantao-tagline">Ronaldo Maestro · escuta ativa</p>
        <p class="voice-status plantao-status" id="voice-status">Iniciando…</p>
      </div>

      <p class="plantao-hint">
        Diga <strong>“Ronaldo na escuta”</strong> ou fale direto:<br>
        <em>“Ronaldo, status da operação”</em>
      </p>
    </main>
  </div>

  <script src="auth.js"></script>
  <script src="voice-core.js"></script>
  <script src="central-comunicacao.js"></script>
</body>
</html>
